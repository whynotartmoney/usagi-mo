<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#8ec8ea" />
  <title>Usagi X Carya</title>
  <link rel="icon" href="assets/sprites/idle.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div class="hud-chip">
        <span class="hud-ico" aria-hidden="true">●</span>
        <span id="hud-coins">0</span>
      </div>
      <div class="hud-chip hud-hero">
        <canvas id="hud-hero" width="44" height="44"></canvas>
        <span id="hud-lives">×3</span>
      </div>
      <div class="hud-chip" id="hud-world">1-1</div>
      <div class="hud-chip hud-time" id="hud-time">0:00.00</div>
      <div class="hud-chip hud-score">
        <span id="hud-score">000000</span>
      </div>
    </div>

    <div id="controls" hidden>
      <div class="pad">
        <span class="pad-hub" aria-hidden="true"></span>
        <button type="button" class="btn btn-dir" id="btn-up" aria-label="向上"></button>
        <button type="button" class="btn btn-dir" id="btn-left" aria-label="向左"></button>
        <button type="button" class="btn btn-dir" id="btn-right" aria-label="向右"></button>
        <button type="button" class="btn btn-dir" id="btn-down" aria-label="向下"></button>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-atk" id="btn-attack" aria-label="攻擊"></button>
        <button type="button" class="btn btn-jump" id="btn-jump" aria-label="跳躍"></button>
      </div>
    </div>

    <button type="button" id="btn-hero" class="hero-orb" aria-label="選擇角色">
      <canvas id="hero-orb-face" width="160" height="160"></canvas>
    </button>
    <input id="hero-file" type="file" accept="image/*" hidden />

    <button type="button" id="btn-3d" class="orb-3d" aria-label="3D 立體" aria-pressed="false">
      <span class="orb-shine" aria-hidden="true"></span>
      <span class="orb-word">3D</span>
    </button>

    <div id="overlay" class="overlay">
      <div class="card" id="card-title">
        <img class="title-usagi" id="title-usagi" src="assets/sprites/idle.png" alt="Usagi" />
        <canvas class="title-usagi title-hero-canvas" id="title-hero" width="240" height="240" hidden></canvas>
        <p class="kicker">USAGI X CARYA</p>
        <h1>Usagi X Carya</h1>
        <p class="lead">橫版過關 · 跑起來、跳過去</p>
        <button type="button" class="cta" id="btn-start">開始遊戲</button>
        <p class="levels-label">關卡選擇</p>
        <div class="card-levels" id="level-select">
          <button type="button" class="lvl" data-level="0">1-1<span>草原</span></button>
          <button type="button" class="lvl" data-level="1">1-2<span>火山</span></button>
          <button type="button" class="lvl" data-level="2">1-3<span>遊樂場</span></button>
          <button type="button" class="lvl" data-level="3">1-4<span>康丁斯基</span></button>
          <button type="button" class="lvl" data-level="4">1-5<span>天空之城</span></button>
          <button type="button" class="lvl" data-level="5">1-6<span>海洋之旅</span></button>
          <button type="button" class="lvl" data-level="6">1-7<span>上樓梯</span></button>
          <button type="button" class="lvl" data-level="7">1-8<span>彩虹天堂</span></button>
          <button type="button" class="lvl" data-level="8">1-9<span>露營打怪</span></button>
          <button type="button" class="lvl" data-level="9">1-10<span>摩天輪城</span></button>
          <button type="button" class="lvl" data-level="10">1-11<span>迷宮</span></button>
        </div>
        <p class="hint">鍵盤：← → ↑ ↓ 移動　空白鍵跳躍　J 攻擊<br />手機：用下方按鍵<br />測試用 · 非商業</p>
      </div>
      <div class="card" id="card-end" hidden>
        <img class="title-usagi" id="end-usagi" src="assets/sprites/cheer.png" alt="" />
        <canvas class="title-usagi title-hero-canvas" id="end-hero" width="240" height="240" hidden></canvas>
        <div class="poop" id="end-poop" hidden aria-hidden="true">
          <div class="poop-blob poop-3"></div>
          <div class="poop-blob poop-2"></div>
          <div class="poop-blob poop-1"></div>
          <div class="poop-face">
            <i class="poop-eye"></i>
            <i class="poop-eye"></i>
          </div>
        </div>
        <h1 id="end-title">過關！</h1>
        <p class="lead" id="end-msg">十一關都完成了</p>
        <div class="end-stats" id="end-stats" hidden>
          <div><span>時間</span><strong id="end-time">0:00.00</strong></div>
          <div><span>金幣</span><strong id="end-coins">0</strong></div>
          <div><span>分數</span><strong id="end-points">000000</strong></div>
        </div>
        <p class="end-score" id="end-score"></p>
        <p class="end-times" id="end-times"></p>
        <button type="button" class="cta" id="btn-next">下一關</button>
        <button type="button" class="cta" id="btn-again">再玩一次</button>
      </div>
    </div>

    <div id="hero-modal" class="hero-modal" hidden>
      <div class="hero-sheet">
        <p class="kicker">選擇主角</p>
        <h2>卡通角色</h2>
        <div class="hero-grid" id="hero-grid">
          <button type="button" class="hero-pick" data-hero="usagi"><canvas></canvas><span>兔兔</span></button>
          <button type="button" class="hero-pick" data-hero="flower"><canvas></canvas><span>滑板花</span></button>
          <button type="button" class="hero-pick" data-hero="puff"><canvas></canvas><span>怒怒雲</span></button>
          <button type="button" class="hero-pick" data-hero="shy"><canvas></canvas><span>害羞藍</span></button>
          <button type="button" class="hero-pick" data-hero="grin"><canvas></canvas><span>開心紫</span></button>
          <button type="button" class="hero-pick" data-hero="heart"><canvas></canvas><span>愛心</span></button>
          <button type="button" class="hero-pick hero-pick-custom" data-hero="custom" id="hero-custom-btn"><canvas></canvas><span>上傳頭相</span></button>
        </div>
        <button type="button" class="cta" id="hero-close">完成</button>
      </div>
    </div>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
